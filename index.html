<!DOCTYPE html>
<html lang="en" data-theme="light" data-font-scale="md" data-accent="teal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="2ndMBstudy — your 2nd mb study website. Organise Second MBBS Anatomy, Biochemistry, and Physiology, track progress toward March 1, 2027, and study smarter with AI." />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="2ndMBstudy" />

  <title>2ndMBstudy — your 2nd mb study website</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/app.css" />

  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <noscript>
    <div style="padding: 24px; font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto;">
      <h1>2ndMBstudy</h1>
      <p>your 2nd mb study website</p>
      <p>JavaScript is required to run this study tracker and AI workspace. Please enable JavaScript in your browser settings.</p>
    </div>
  </noscript>

  <div id="app-shell" class="app-shell">
    <!-- Left Sidebar Navigation (Desktop-style Layout) -->
    <aside id="desktop-sidebar" class="desktop-sidebar" aria-label="Primary Navigation">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">2M</div>
        <div class="brand-text">
          <span class="brand-name">2ndMBstudy</span>
          <span class="brand-subtitle">your 2nd mb study website</span>
        </div>
      </div>

      <nav class="side-nav" aria-label="Main sections">
        <button type="button" class="nav-item is-active" data-nav-view="dashboard">
          <span>Dashboard</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="syllabus">
          <span>2nd MB Syllabus</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="timer">
          <span>Study Timer</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="planner">
          <span>Planner &amp; Timetable</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="analytics">
          <span>Analytics &amp; Backup</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="ai-coach">
          <span>AI Coach</span>
        </button>
        <button type="button" class="nav-item" data-nav-view="materials">
          <span>Study Materials</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div id="header-countdown" class="countdown-chip" title="Target 2nd MB Examination Date">
          <span id="header-countdown-text">Target: March 1, 2027</span>
        </div>
        <div id="header-plan-badge" class="plan-pill">Free · ₦1,000 Once</div>
        <button type="button" id="header-upgrade-btn" class="btn btn-primary btn-sm">
          Upgrade · ₦1,000 Once
        </button>
        <p class="credit-note">Designed by Davidesign</p>
      </div>
    </aside>

    <!-- Main Workspace Column -->
    <div class="main-column">
      <header id="top-header" class="top-header">
        <div class="header-left">
          <div class="mobile-brand">
            <div class="brand-mark brand-mark--sm" aria-hidden="true">2M</div>
            <div class="brand-text">
              <span class="brand-name">2ndMBstudy</span>
              <span class="brand-subtitle">your 2nd mb study website</span>
            </div>
          </div>
          <div id="header-context-title" class="header-context-title">Dashboard</div>
        </div>

        <div class="header-right">
          <button type="button" id="font-scale-btn" class="icon-btn" title="Cycle text size">
            A/a (MD)
          </button>
          <button type="button" id="theme-toggle-btn" class="icon-btn" title="Switch Light / Dark Mode" aria-label="Switch Light or Dark Mode">
            🌙 Dark
          </button>
        </div>
      </header>

      <!-- Global Toast Area -->
      <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

      <!-- Primary Dynamic View Container -->
      <main id="view-container" class="main-view" tabindex="-1">
        <div class="state-card state-loading">
          <p class="state-title">Loading 2ndMBstudy…</p>
          <p class="state-desc">Preparing your 2nd MB curriculum, study tracker, and local workspace.</p>
        </div>
      </main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav id="mobile-bottom-nav" class="mobile-bottom-nav" aria-label="Mobile Navigation">
      <button type="button" class="bottom-nav-item is-active" data-nav-view="dashboard">
        <span>Home</span>
      </button>
      <button type="button" class="bottom-nav-item" data-nav-view="syllabus">
        <span>Syllabus</span>
      </button>
      <button type="button" class="bottom-nav-item" data-nav-view="timer">
        <span>Timer</span>
      </button>
      <button type="button" class="bottom-nav-item" data-nav-view="ai-coach">
        <span>AI Coach</span>
      </button>
      <button type="button" id="mobile-more-btn" class="bottom-nav-item" data-nav-view="materials">
        <span>Materials</span>
      </button>
    </nav>

    <!-- Modal / Drawer Root -->
    <div id="modal-root" class="modal-root hidden" aria-hidden="true"></div>
  </div>
</body>
</html>
